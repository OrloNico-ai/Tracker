<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Objetivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F5F5;--surface:#fff;--ink:#0A0A0A;--ink2:#555;--ink3:#AAA;
  --border:#E8E8E8;--green:#18A058;--orange:#F07020;--red:#DC2626;--radius:14px;
}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:90px}

header{background:#fff;padding:52px 20px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.app-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:1px;line-height:1}
.app-date{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.add-btn{width:42px;height:42px;border-radius:50%;background:var(--ink);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s,background .18s;padding-bottom:1px;flex-shrink:0}
.add-btn:active{transform:scale(.9)}
.tabs{display:flex}
.tab{flex:1;padding:10px 0 12px;background:none;border:none;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);cursor:pointer;position:relative;transition:color .15s}
.tab.active{color:var(--ink)}
.tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--ink);border-radius:2px 2px 0 0}

main{max-width:520px;margin:0 auto;padding:0 16px}

.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
.nav-center{flex:1;text-align:center}
.nav-label{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.week-pill{display:inline-block;background:var(--ink);color:#fff;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-top:4px}
.nav-arrow{width:34px;height:34px;border-radius:8px;background:none;border:1.5px solid var(--border);color:var(--ink2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.nav-arrow:active{transform:scale(.9)}

.days-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:14px;border:1px solid var(--border)}
.strip-day{text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.strip-letter{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.strip-num{font-size:14px;font-weight:600;color:var(--ink2);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.strip-num.today{background:var(--ink);color:#fff;font-weight:700}

.goal-card{position:relative;border-radius:var(--radius);margin-bottom:10px;overflow:hidden;animation:fadeUp .25s ease both;height:72px;display:flex;align-items:center;cursor:default}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.goal-card-bg{position:absolute;inset:0;opacity:.18;transition:width .45s cubic-bezier(.4,0,.2,1)}
.goal-card-fill{position:absolute;top:0;left:0;bottom:0;transition:width .45s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:.13}
.goal-card-fill.done{opacity:1}
.goal-card-inner{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:0 14px;width:100%}
.goal-card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(255,255,255,.25)}
.goal-card-text{flex:1;min-width:0}
.goal-card-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.goal-card-meta{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2);margin-top:2px}
.goal-card-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.goal-card-pct{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;line-height:1;min-width:44px;text-align:right}
.goal-plus-btn{width:38px;height:38px;border-radius:50%;border:2.5px solid currentColor;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .16s cubic-bezier(.34,1.4,.64,1);-webkit-tap-highlight-color:transparent;flex-shrink:0}
.goal-plus-btn:active{transform:scale(.88)}
.goal-plus-btn.done{background:currentColor}
.goal-plus-btn .plus-icon{font-size:20px;line-height:1;font-weight:300;transition:color .15s}
.goal-plus-btn.done .plus-icon{color:#fff}
.goal-edit-btn{background:none;border:1.5px solid var(--border);border-radius:8px;color:var(--ink3);cursor:pointer;font-size:12px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.goal-edit-btn:active{border-color:var(--ink);color:var(--ink)}

.empty{text-align:center;padding:60px 20px}
.empty-icon{font-size:40px;margin-bottom:14px}
.empty-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;color:var(--ink2);margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--ink3);font-weight:500}

.month-hero{background:var(--ink);color:#fff;border-radius:var(--radius);padding:28px 24px;margin-bottom:14px;text-align:center}
.m-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.5;margin-bottom:6px}
.m-big{font-family:'Bebas Neue',sans-serif;font-size:88px;letter-spacing:-1px;line-height:1;margin-bottom:8px}
.m-msg{font-size:13px;font-weight:500;opacity:.65}

.month-card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;margin-bottom:8px;border:1px solid var(--border);animation:fadeUp .25s ease both}
.m-circle{flex-shrink:0;position:relative;width:56px;height:56px}
.m-circle svg{transform:rotate(-90deg)}
.m-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.5px}
.m-body{flex:1;min-width:0}
.m-name-row{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.m-name{font-size:14px;font-weight:700}
.m-sub{font-size:11px;color:var(--ink3);font-weight:500;margin-bottom:8px}
.m-bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden}
.m-fill{height:100%;border-radius:4px;transition:width .55s cubic-bezier(.4,0,.2,1)}

/* ── MONTH HISTOGRAM ── */
.m-histogram{overflow:hidden;max-height:0;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.m-histogram.open{max-height:160px}
.histogram-inner{padding-top:12px}
.histogram-bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-bottom:6px}
.hbar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.hbar-track{width:100%;flex:1;background:var(--border);border-radius:4px;overflow:hidden;display:flex;align-items:flex-end;position:relative}
.hbar-fill{width:100%;border-radius:4px;transition:height .5s cubic-bezier(.4,0,.2,1);position:absolute;bottom:0}
.hbar-val{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.3px;color:var(--ink3)}
.hbar-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.5px;text-transform:uppercase}
.m-expand-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;padding:0;margin-top:6px;-webkit-tap-highlight-color:transparent}
.m-expand-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.m-expand-arrow{font-size:10px;color:var(--ink3);transition:transform .3s}
.m-expand-arrow.open{transform:rotate(180deg)}

/* ── BEST MONTH ── */
.best-month-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:20px;padding:4px 12px;margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.best-month-badge .star{font-size:12px}

/* ── CELEBRATION ── */
#celebrate{position:fixed;inset:0;z-index:200;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
#celebrate.show{opacity:1}
.celebrate-inner{background:var(--ink);color:#fff;border-radius:20px;padding:20px 32px;text-align:center;transform:scale(.8);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
#celebrate.show .celebrate-inner{transform:scale(1)}
.celebrate-emoji{font-size:40px;margin-bottom:6px}
.celebrate-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin-bottom:2px}
.celebrate-sub{font-size:12px;font-weight:500;opacity:.65}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:8px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.overlay.open .modal{transform:translateY(0)}
.handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 20px}
.modal-inner{padding:0 20px 48px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;margin-bottom:24px}
.fgrp{margin-bottom:22px}
.flbl{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ebtn{width:42px;height:42px;border-radius:10px;border:2px solid transparent;background:var(--bg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s}
.ebtn:active{transform:scale(.85)}
.ebtn.sel{border-color:var(--ink);background:#fff}
.tinput{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;font-family:'Barlow',sans-serif;font-weight:500;background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s}
.tinput:focus{border-color:var(--ink);background:#fff}
.tinput::placeholder{color:var(--ink3);font-weight:400}
.range-row{display:flex;align-items:center;gap:12px}
.rinput{flex:1;-webkit-appearance:none;height:4px;border-radius:4px;background:var(--border);outline:none}
.rinput::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ink);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.rval{font-family:'Bebas Neue',sans-serif;font-size:30px;min-width:30px;text-align:center;letter-spacing:1px}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .14s;outline:none}
.cdot.sel{border-color:var(--ink);transform:scale(1.14)}
.cdot:active{transform:scale(.85)}
.sbtn{width:100%;padding:16px;background:var(--ink);color:#fff;border:none;border-radius:14px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .18s,transform .15s;margin-top:6px}
.sbtn:hover{background:var(--green)}
.sbtn:active{transform:scale(.98)}
.dbtn{width:100%;padding:13px;background:none;color:var(--red);border:2px solid var(--border);border-radius:14px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:all .15s}
.dbtn:hover{background:#FEF0F0;border-color:var(--red)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── RUTINA ── */
.rutina-section-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);padding:20px 0 10px}

.rutina-card{background:var(--surface);border-radius:var(--radius);margin-bottom:10px;border:1px solid var(--border);overflow:hidden;animation:fadeUp .25s ease both}
.rutina-card-header{display:flex;align-items:center;gap:12px;padding:16px 16px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.rutina-color-strip{width:4px;border-radius:4px;flex-shrink:0;align-self:stretch;min-height:36px}
.rutina-card-body{flex:1;min-width:0}
.rutina-card-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;line-height:1;text-decoration:none;cursor:pointer}
.rutina-card-name:active{opacity:.7}
.rutina-card-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.rutina-meta-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rutina-card-count{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.r-card-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.r-edit-btn{background:none;border:1.5px solid var(--border);border-radius:8px;color:var(--ink3);cursor:pointer;font-size:13px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.r-edit-btn:active{border-color:var(--ink);color:var(--ink)}
.rutina-chevron{font-size:18px;color:var(--ink3);transition:transform .25s;font-weight:300}
.rutina-chevron.open{transform:rotate(90deg)}

.rutina-exercises{display:none;padding:0 16px 4px 16px}
.rutina-exercises.open{display:block}
.ex-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.ex-color-pill{height:28px;padding:0 10px;border-radius:6px;display:flex;align-items:center;flex-shrink:0;min-width:28px;justify-content:center}
.ex-num{font-family:'Bebas Neue',sans-serif;font-size:13px;color:white;letter-spacing:.5px}
.ex-name{font-size:14px;font-weight:700;flex:1;letter-spacing:.1px}
.ex-detail{background:var(--bg);border-radius:6px;padding:4px 8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--ink2);white-space:nowrap}

.rutina-empty{text-align:center;padding:60px 20px}
.rutina-empty-icon{font-size:40px;margin-bottom:14px}
.rutina-empty-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;color:var(--ink2);margin-bottom:6px}
.rutina-empty-sub{font-size:13px;color:var(--ink3);font-weight:500}

/* ── RUTINA DETAIL ── */
.rdetail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:150;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s}
.rdetail-overlay.open{opacity:1;pointer-events:all}
.rdetail-sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:520px;margin:0 auto;flex:1;margin-top:60px;overflow:hidden;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
.rdetail-overlay.open .rdetail-sheet{transform:translateY(0)}
.rdetail-top{background:var(--ink);color:#fff;padding:28px 20px 22px;border-radius:22px 22px 0 0;flex-shrink:0}
.rdetail-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.rdetail-close:active{background:rgba(255,255,255,.3)}
.rdetail-name{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:1px;line-height:1;margin-bottom:4px}
.rdetail-subtitle{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.5}
.rdetail-body{padding:16px 16px 48px;flex:1;overflow-y:auto}

.rdetail-ex-block{margin-bottom:8px}
.rdetail-ex-row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:13px 14px;border:1px solid var(--border)}
.rdetail-ex-pill{height:28px;padding:0 10px;border-radius:6px;display:flex;align-items:center;flex-shrink:0}
.rdetail-ex-num{font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fff;letter-spacing:.5px}
.rdetail-ex-name{font-size:14px;font-weight:700;flex:1}
.rdetail-ex-sets{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:.5px}

.rdetail-weeks{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.rdetail-week-row{background:var(--surface);border-radius:12px;padding:12px 14px;border:1px solid var(--border)}
.rdetail-week-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.rdetail-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rdetail-slot{width:100%;padding:9px 8px;border:2px solid var(--border);border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.5px;text-align:center;background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s}
.rdetail-slot:focus{border-color:var(--ink);background:#fff}
.rdetail-slot::placeholder{color:var(--ink3);font-weight:400;font-size:12px}

/* modal rutina */
.ex-color-pick{display:flex;gap:8px;margin-bottom:12px}
.excol{width:32px;height:32px;border-radius:8px;border:3px solid transparent;cursor:pointer;transition:all .14s;flex-shrink:0}
.excol.sel{border-color:var(--ink);transform:scale(1.1)}
.excol:active{transform:scale(.88)}
.ex-list-preview{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ex-preview-row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
.ex-preview-pill{height:24px;padding:0 8px;border-radius:5px;display:flex;align-items:center}
.ex-preview-name{font-size:13px;font-weight:700;flex:1}
.ex-preview-detail{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--ink3);white-space:nowrap;margin-right:4px}
.ex-preview-del{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:16px;padding:2px 4px;line-height:1}
.ex-preview-del:active{color:var(--red)}
.add-ex-btn{background:var(--ink);border:none;border-radius:10px;padding:12px;width:100%;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;cursor:pointer;margin-top:8px;transition:all .15s}
.add-ex-btn:active{opacity:.8;transform:scale(.98)}
.ex-input-row{display:flex;gap:8px;margin-top:0}
.ex-input-row .tinput{flex:1}
.ex-detail-input{width:80px!important;flex:none!important}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <div class="app-title">Objetivos</div>
      <div class="app-date" id="appDate">—</div>
    </div>
    <button class="add-btn" onclick="openModal()">+</button>
  </div>
  <div class="tabs">
    <button class="tab active" id="tabW" onclick="switchView('week')">Semana</button>
    <button class="tab" id="tabM" onclick="switchView('month')">Mes</button>
    <button class="tab" id="tabR" onclick="switchView('rutina')">Rutina</button>
  </div>
</header>

<main>
  <div id="weekView">
    <div class="nav-bar">
      <button class="nav-arrow" onclick="navWeek(-1)">&#8249;</button>
      <div class="nav-center">
        <div class="nav-label" id="weekLbl">—</div>
        <div id="weekBadge"></div>
      </div>
      <button class="nav-arrow" onclick="navWeek(1)">&#8250;</button>
    </div>
    <div class="days-strip" id="daysStrip"></div>
    <div id="goalsList"></div>
    <div class="empty" id="emptyW" style="display:none">
      <div class="empty-icon">🎯</div>
      <div class="empty-title">Sin objetivos</div>
      <div class="empty-sub">Tocá + para agregar el primero</div>
    </div>
  </div>

  <div id="monthView" style="display:none">
    <div class="nav-bar">
      <button class="nav-arrow" onclick="navMonth(-1)">&#8249;</button>
      <div class="nav-center"><div class="nav-label" id="monthLbl">—</div></div>
      <button class="nav-arrow" onclick="navMonth(1)">&#8250;</button>
    </div>
    <div class="month-hero" id="mHero"></div>
    <div id="monthList"></div>
  </div>

  <!-- RUTINA -->
  <div id="rutinaView" style="display:none">
    <div class="rutina-header">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px">Mis Rutinas</div>
    </div>
    <div id="rutinaList"></div>
    <div class="rutina-empty" id="emptyR" style="display:none">
      <div class="rutina-empty-icon">💪</div>
      <div class="rutina-empty-title">Sin rutinas</div>
      <div class="rutina-empty-sub">Tocá + para crear la primera</div>
    </div>
  </div>
</main>

<div id="celebrate"><div class="celebrate-inner"><div class="celebrate-emoji">🔥</div><div class="celebrate-title">¡Día completo!</div><div class="celebrate-sub">Cumpliste todos los objetivos de hoy</div></div></div>

<div class="overlay" id="overlay" onclick="bgClose(event)">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-inner">
      <div class="modal-title" id="mTitle">Nuevo objetivo</div>
      <div class="fgrp">
        <label class="flbl">Ícono</label>
        <div class="emoji-grid" id="emojiGrid"></div>
        <input class="tinput" id="customEmoji" placeholder="O escribí tu propio emoji…" maxlength="4" style="margin-top:6px">
      </div>
      <div class="fgrp">
        <label class="flbl">Nombre</label>
        <input class="tinput" id="nameInp" placeholder="ej. Salir a correr" maxlength="30">
      </div>

        <label class="flbl">Objetivo semanal (veces)</label>
        <div class="range-row">
          <span style="font-size:12px;color:var(--ink3);font-weight:600">1</span>
          <input class="rinput" type="range" id="targetR" min="1" max="7" value="5" oninput="document.getElementById('targetV').textContent=this.value">
          <span style="font-size:12px;color:var(--ink3);font-weight:600">7</span>
          <span class="rval" id="targetV">5</span>
        </div>
      </div>
      <div class="fgrp">
        <label class="flbl">Color</label>
        <div class="color-row" id="colorRow"></div>
      </div>
      <button class="sbtn" onclick="saveGoal()">Guardar</button>
      <button class="dbtn" id="delBtn" style="display:none" onclick="deleteGoal()">Eliminar objetivo</button>
    </div>
  </div>
</div>

<script>
const EMOJIS=['🏃','🏋️','🧘','💧','📚','✍️','🥗','😴','🎸','🎨','💊','🧹','💰','🤝','🌿','🧠','🏊','🚴','🎯','🪴','☕','🍎','🌞','🫶'];
const COLORS=['#111111','#18A058','#E63946','#2563EB','#F07020','#9333EA','#0891B2','#DC2626','#CA8A04','#0F766E'];
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DS=['L','M','X','J','V','S','D'];
let goals=[],completions={},wCounts={},wOff=0,mOff=0,view='week';
let editId=null,selEmoji='🏃',selColor=COLORS[0];

function load(){
  try{
    const d=JSON.parse(localStorage.getItem('obj_v4')||'{}');
    goals=d.goals||[];completions=d.completions||{};wCounts=d.wCounts||{};
  }catch(e){}
}
function persist(){localStorage.setItem('obj_v4',JSON.stringify({goals,completions,wCounts}));}
function today(){return fmt(new Date());}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function weekKey(off){
  // Monday of the offset week
  const now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now);
  mon.setDate(now.getDate()-dow+off*7);mon.setHours(0,0,0,0);
  return fmt(mon);
}
function weekDates(off){
  const now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now);
  mon.setDate(now.getDate()-dow+off*7);mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return fmt(d);});
}
function monthDates(off){
  const now=new Date(),t=new Date(now.getFullYear(),now.getMonth()+off,1);
  const days=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return Array.from({length:days},(_,i)=>fmt(new Date(t.getFullYear(),t.getMonth(),i+1)));
}
function pClr(p){return p>=80?'#18A058':p>=50?'#F07020':'#DC2626';}

function getWeekCount(goalId,off){
  const k=weekKey(off);
  return (wCounts[k]&&wCounts[k][goalId])||0;
}

function renderWeek(){
  const td=today(),dates=weekDates(wOff);
  const s=new Date(dates[0]),e=new Date(dates[6]),o={day:'numeric',month:'short'};
  document.getElementById('weekLbl').textContent=`${s.toLocaleDateString('es',o)} — ${e.toLocaleDateString('es',{...o,year:'numeric'})}`;
  document.getElementById('weekBadge').innerHTML=wOff===0?'<div class="week-pill">Esta semana</div>':'';

  const strip=document.getElementById('daysStrip');
  strip.innerHTML='';
  dates.forEach((d,i)=>{
    const isT=d===td,dn=new Date(d).getDate();
    const el=document.createElement('div');el.className='strip-day';
    el.innerHTML=`<span class="strip-letter">${DS[i]}</span><span class="strip-num ${isT?'today':''}">${dn}</span>`;
    strip.appendChild(el);
  });

  const list=document.getElementById('goalsList');
  list.innerHTML='';
  document.getElementById('emptyW').style.display=goals.length?'none':'block';

  goals.forEach((g,gi)=>{
    const count=getWeekCount(g.id,wOff);
    const pct=Math.round((count/g.target)*100);
    const fillPct=Math.min(pct,100);
    const isDone=count>=g.target;
    const isPast=wOff<0;

    const card=document.createElement('div');
    card.className='goal-card';
    card.style.animationDelay=gi*30+'ms';
    card.style.background=`${g.color}14`;
    card.style.border=`1px solid ${g.color}30`;

    card.innerHTML=`
      <div class="goal-card-fill${isDone?' done':''}" style="width:${fillPct}%;background:${g.color}"></div>
      <div class="goal-card-inner">
        <div class="goal-card-icon">${g.icon}</div>
        <div class="goal-card-text">
          <div class="goal-card-name" style="color:${isDone?'#fff':''}">${g.name}</div>
          <div class="goal-card-meta" style="color:${isDone?'rgba(255,255,255,.7)':''}">${count} / ${g.target} esta semana</div>
        </div>
        <div class="goal-card-right">
          <div class="goal-card-pct" style="color:${isDone?'#fff':g.color}">${pct}%</div>
          <button class="goal-edit-btn" style="${isDone?'border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.7)':''}" onclick="openEdit('${g.id}')">✎</button>
          <button class="goal-plus-btn" style="
            color:${isDone?'#fff':g.color};
            background:${isDone?'rgba(255,255,255,.25)':g.color+'28'};
            border-color:${isDone?'rgba(255,255,255,.5)':g.color+'60'};
          " onclick="increment('${g.id}')" ${isPast?'disabled':''}>
            <span class="plus-icon" style="color:${isDone?'#fff':g.color}">+</span>
          </button>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

function increment(goalId){
  const k=weekKey(wOff);
  if(!wCounts[k])wCounts[k]={};
  wCounts[k][goalId]=(wCounts[k][goalId]||0)+1;
  if(navigator.vibrate)navigator.vibrate(30);
  persist();renderWeek();
  // celebration when hitting target exactly
  const g=goals.find(x=>x.id===goalId);
  if(g&&wCounts[k][goalId]===g.target){
    const allDone=goals.every(g2=>(wCounts[k][g2.id]||0)>=g2.target);
    if(allDone)showCelebration();
  }
}

function showCelebration(){
  const el=document.getElementById('celebrate');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

function getMonthWeekKeys(off){
  // Returns the Monday keys of all weeks that overlap with the given month offset
  const now=new Date(),t=new Date(now.getFullYear(),now.getMonth()+off,1);
  const y=t.getFullYear(),m=t.getMonth();
  const keys=[];
  // iterate all wCounts keys and check which month they belong to
  Object.keys(wCounts).forEach(k=>{
    const d=new Date(k);
    // a week "belongs" to a month if its Monday is in that month or overlaps
    if(d.getFullYear()===y&&d.getMonth()===m)keys.push(k);
  });
  return keys;
}

function getMonthCount(goalId,off){
  const keys=getMonthWeekKeys(off);
  return keys.reduce((sum,k)=>(sum+(wCounts[k]?.[goalId]||0)),0);
}

function getBestMonth(){
  const monthMap={};
  Object.keys(wCounts).forEach(k=>{
    const mk=k.slice(0,7);
    if(!monthMap[mk])monthMap[mk]=[];
    monthMap[mk].push(k);
  });
  let bestMk=null,bestAvg=0;
  Object.entries(monthMap).forEach(([mk,keys])=>{
    if(!goals.length)return;
    const avgs=goals.map(g=>{
      const done=keys.reduce((s,k)=>s+(wCounts[k]?.[g.id]||0),0);
      return Math.round((done/(g.target*4))*100);
    });
    const avg=Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length);
    if(avg>bestAvg){bestAvg=avg;bestMk=mk;}
  });
  return bestMk?{mk:bestMk,avg:bestAvg}:null;
}

function getWeeklyBars(goalId,off){
  const now=new Date(),t=new Date(now.getFullYear(),now.getMonth()+off,1);
  const y=t.getFullYear(),m=t.getMonth();
  return Array.from({length:4},(_,wi)=>{
    // Monday of week wi in this month
    const mon=new Date(y,m,wi*7+1);
    // find nearest Monday
    const dow=(mon.getDay()+6)%7;
    mon.setDate(mon.getDate()-dow);
    const k=fmt(mon);
    const g=goals.find(x=>x.id===goalId);
    const done=(wCounts[k]&&wCounts[k][goalId])||0;
    const tgt=g?g.target:1;
    return{done,tgt,pct:Math.round((done/tgt)*100)};
  });
}

function renderMonth(){
  const now=new Date(),t=new Date(now.getFullYear(),now.getMonth()+mOff,1);
  document.getElementById('monthLbl').textContent=`${MONTHS[t.getMonth()]} ${t.getFullYear()}`;
  const stats=goals.map(g=>{
    const done=getMonthCount(g.id,mOff);
    const tgt=g.target*4;
    const pct=Math.round((done/tgt)*100);
    return{...g,done,tgt,pct};
  });
  const avg=stats.length?Math.round(stats.reduce((a,b)=>a+b.pct,0)/stats.length):0;
  const msg=avg>=80?'Excelente mes. Seguí así.':avg>=50?'Buen progreso, podés dar más.':'Mes difícil. El próximo va a ser mejor.';

  const best=getBestMonth();
  const currentMk=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`;
  const isBest=best&&best.mk===currentMk&&best.avg>0;
  const bestHtml=isBest?`<div class="best-month-badge"><span class="star">★</span> Mejor mes — ${best.avg}%</div>`:
    best&&best.mk!==currentMk?`<div class="best-month-badge"><span class="star">★</span> Mejor mes: ${MONTHS[parseInt(best.mk.split('-')[1])-1]} ${best.avg}%</div>`:'';

  document.getElementById('mHero').innerHTML=`<div class="m-label">Promedio mensual</div><div class="m-big">${avg}%</div><div class="m-msg">${msg}</div>${bestHtml}`;
  const list=document.getElementById('monthList');list.innerHTML='';
  if(!stats.length){list.innerHTML='<div class="empty"><div class="empty-icon">🎯</div><div class="empty-title">Sin objetivos</div></div>';return;}
  stats.forEach((s,i)=>{
    const clr=pClr(s.pct),r=22,circ=2*Math.PI*r,dash=(Math.min(s.pct,100)/100)*circ;
    const weekBars=getWeeklyBars(s.id,mOff);
    const maxVal=Math.max(...weekBars.map(w=>w.done),s.tgt/4,1);

    const barsHtml=weekBars.map((w,wi)=>{
      const heightPct=Math.round((w.done/maxVal)*100);
      const barClr=w.done>=s.tgt/4?clr:clr+'80';
      return `
        <div class="hbar-col" style="${w.done===0?'opacity:0;pointer-events:none':''}">
          <div class="hbar-val">${w.done>0?w.done:''}</div>
          <div class="hbar-track">
            <div class="hbar-fill" style="height:${heightPct}%;background:${barClr}"></div>
          </div>
          <div class="hbar-lbl">S${wi+1}</div>
        </div>`;
    }).join('');

    const c=document.createElement('div');c.className='month-card';c.style.animationDelay=i*35+'ms';
    const hid=`hist-${s.id}`,aid=`harr-${s.id}`;
    c.innerHTML=`
      <div style="display:flex;align-items:center;gap:14px">
        <div class="m-circle" style="flex-shrink:0">
          <svg width="56" height="56" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="${r}" fill="none" stroke="#F0F0F0" stroke-width="5"/>
            <circle cx="28" cy="28" r="${r}" fill="none" stroke="${clr}" stroke-width="5" stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
          </svg>
          <div class="m-num" style="color:${clr}">${s.pct}%</div>
        </div>
        <div class="m-body" style="flex:1;min-width:0">
          <div class="m-name-row"><span style="font-size:18px">${s.icon}</span><span class="m-name">${s.name}</span></div>
          <div class="m-sub">${s.done} de ${s.tgt} veces objetivo</div>
          <div class="m-bar"><div class="m-fill" style="width:${Math.min(s.pct,100)}%;background:${clr}"></div></div>
          <button class="m-expand-btn" onclick="toggleHistogram('${hid}','${aid}')">
            <span class="m-expand-lbl">Semanas</span>
            <span class="m-expand-arrow" id="${aid}">▾</span>
          </button>
        </div>
      </div>
      <div class="m-histogram" id="${hid}">
        <div class="histogram-inner">
          <div class="histogram-bars">${barsHtml}</div>
        </div>
      </div>`;
    list.appendChild(c);
  });
}

function navWeek(d){wOff+=d;renderWeek();}
function navMonth(d){mOff+=d;renderMonth();}
function toggleHistogram(hid,aid){
  const h=document.getElementById(hid),a=document.getElementById(aid);
  if(!h||!a)return;
  h.classList.toggle('open');
  a.classList.toggle('open');
}
function switchView(v){
  view=v;
  document.getElementById('weekView').style.display=v==='week'?'block':'none';
  document.getElementById('monthView').style.display=v==='month'?'block':'none';
  document.getElementById('rutinaView').style.display=v==='rutina'?'block':'none';
  document.getElementById('tabW').className='tab'+(v==='week'?' active':'');
  document.getElementById('tabM').className='tab'+(v==='month'?' active':'');
  document.getElementById('tabR').className='tab'+(v==='rutina'?' active':'');
  // update add btn target
  document.querySelector('.add-btn').onclick=v==='rutina'?openNewRutina:openModal;
  if(v==='month')renderMonth();
  if(v==='rutina')renderRutina();
}

function buildModalUI(){
  const grid=document.getElementById('emojiGrid');grid.innerHTML='';
  EMOJIS.forEach(e=>{
    const b=document.createElement('button');b.className='ebtn'+(e===selEmoji?' sel':'');
    b.textContent=e;b.onclick=()=>{selEmoji=e;document.getElementById('customEmoji').value='';buildModalUI();};
    grid.appendChild(b);
  });
  const cr=document.getElementById('colorRow');cr.innerHTML='';
  COLORS.forEach(c=>{
    const b=document.createElement('button');b.className='cdot'+(c===selColor?' sel':'');
    b.style.background=c;b.onclick=()=>{selColor=c;buildModalUI();};cr.appendChild(b);
  });
}
function openModal(){
  editId=null;selEmoji='🏃';selColor=COLORS[0];
  document.getElementById('nameInp').value='';
  document.getElementById('targetR').value=5;document.getElementById('targetV').textContent=5;
  document.getElementById('customEmoji').value='';
  document.getElementById('mTitle').textContent='Nuevo objetivo';
  document.getElementById('delBtn').style.display='none';
  buildModalUI();document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('nameInp').focus(),350);
}
function openEdit(id){
  const g=goals.find(x=>x.id===id);if(!g)return;
  editId=id;selEmoji=g.icon;selColor=g.color;
  document.getElementById('nameInp').value=g.name;
  document.getElementById('targetR').value=g.target;document.getElementById('targetV').textContent=g.target;
  document.getElementById('customEmoji').value=EMOJIS.includes(g.icon)?'':g.icon;
  document.getElementById('mTitle').textContent='Editar objetivo';
  document.getElementById('delBtn').style.display='block';
  document.getElementById('delBtn').dataset.id=id;
  buildModalUI();document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function bgClose(e){if(e.target===document.getElementById('overlay'))closeModal();}
function saveGoal(){
  const custom=document.getElementById('customEmoji').value.trim();
  const icon=custom||selEmoji,name=document.getElementById('nameInp').value.trim(),target=parseInt(document.getElementById('targetR').value);
  if(!name){const i=document.getElementById('nameInp');i.style.borderColor='var(--red)';i.focus();setTimeout(()=>i.style.borderColor='',1500);return;}
  if(editId){goals=goals.map(g=>g.id===editId?{...g,icon,name,target,color:selColor}:g);}
  else{goals.push({id:'g'+Date.now(),icon,name,target,color:selColor});}
  persist();closeModal();renderWeek();if(view==='month')renderMonth();
}
function deleteGoal(){
  const btn=document.getElementById('delBtn');
  const id=btn.dataset.id;
  if(!id)return;
  if(btn.dataset.confirming==='1'){
    goals=goals.filter(g=>g.id!==id);
    Object.values(wCounts).forEach(w=>delete w[id]);
    persist();closeModal();renderWeek();if(view==='month')renderMonth();
    btn.dataset.confirming='';btn.textContent='Eliminar';
  } else {
    btn.dataset.confirming='1';
    btn.textContent='⚠️ Tapeá de nuevo para confirmar';
    setTimeout(()=>{btn.dataset.confirming='';btn.textContent='Eliminar';},3000);
  }
}

load();
const n=new Date(),dl=n.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('appDate').textContent=(dl.charAt(0).toUpperCase()+dl.slice(1)).toUpperCase();
renderWeek();

document.getElementById('customEmoji').addEventListener('input',function(){
  if(this.value){selEmoji=this.value;document.querySelectorAll('.ebtn').forEach(b=>b.classList.remove('sel'));}
});

// ── RUTINA DATA & STATE ────────────────────────────────────────────────────
let rutinas=[];
let editRutinaId=null;
let draftExercises=[];
let selExColor='#DC2626';
const EX_COLORS=['#DC2626','#2563EB','#18A058','#CA8A04','#7C3AED'];
const EX_COLOR_NAMES=['Rojo','Azul','Verde','Amarillo','Violeta'];

function loadRutinas(){
  try{const d=JSON.parse(localStorage.getItem('rutinas_v1')||'[]');rutinas=d;}catch(e){rutinas=[];}
}
function persistRutinas(){localStorage.setItem('rutinas_v1',JSON.stringify(rutinas));}

function renderRutina(){
  loadRutinas();
  const list=document.getElementById('rutinaList');
  list.innerHTML='';
  document.getElementById('emptyR').style.display=rutinas.length?'none':'block';
  rutinas.forEach((r,ri)=>{
    const card=document.createElement('div');
    card.className='rutina-card';
    card.style.animationDelay=ri*30+'ms';

    // Collect unique colors in order
    const uniqueColors=[...new Set(r.exercises.map(e=>e.color))];
    const topColor=uniqueColors[0]||'#CCC';
    const dotsHtml=uniqueColors.map(c=>`<div class="rutina-meta-dot" style="background:${c}"></div>`).join('');

    card.innerHTML=`
      <div class="rutina-card-header" onclick="toggleRutina('rc-${r.id}','ch-${r.id}')">
        <div class="rutina-color-strip" style="background:${topColor}"></div>
        <div class="rutina-card-body">
          <div class="rutina-card-name" onclick="event.stopPropagation();openRutinaDetail('${r.id}')">${r.name}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:5px">
            ${dotsHtml}
            <span class="rutina-card-count">${r.exercises.length} ejercicio${r.exercises.length!==1?'s':''}</span>
          </div>
        </div>
        <div class="r-card-right">
          <button class="r-edit-btn" onclick="event.stopPropagation();openEditRutina('${r.id}')">✎</button>
          <span class="rutina-chevron" id="ch-${r.id}">›</span>
        </div>
      </div>
      <div class="rutina-exercises" id="rc-${r.id}">
        ${r.exercises.map((ex,ei)=>`
          <div class="ex-row">
            <div class="ex-color-pill" style="background:${ex.color}">
              <span class="ex-num">${String(ei+1).padStart(2,'0')}</span>
            </div>
            <span class="ex-name">${ex.name}</span>
            ${ex.detail?`<span class="ex-detail">${ex.detail}</span>`:''}
          </div>`).join('')}
      </div>`;
    list.appendChild(card);
  });
}

function toggleRutina(bodyId, chevId){
  const body=document.getElementById(bodyId);
  const chev=document.getElementById(chevId);
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  chev.classList.toggle('open',!isOpen);
}

function openNewRutina(){
  editRutinaId=null;
  draftExercises=[];
  selExColor=EX_COLORS[0];
  document.getElementById('rutinaNameInp').value='';
  document.getElementById('exNameInp').value='';
  document.getElementById('exDetailInp').value='';
  document.getElementById('rModalTitle').textContent='Nueva rutina';
  document.getElementById('delRutinaBtn').style.display='none';
  document.getElementById('delRutinaBtn').dataset.id='';
  buildExColorUI();
  renderDraftExercises();
  document.getElementById('rutinaOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('rutinaNameInp').focus(),350);
}

function openEditRutina(id){
  const r=rutinas.find(x=>x.id===id);if(!r)return;
  editRutinaId=id;
  draftExercises=r.exercises.map(e=>({...e}));
  selExColor=EX_COLORS[0];
  document.getElementById('rutinaNameInp').value=r.name;
  document.getElementById('exNameInp').value='';
  document.getElementById('exDetailInp').value='';
  document.getElementById('rModalTitle').textContent='Editar';
  document.getElementById('delRutinaBtn').style.display='block';
  document.getElementById('delRutinaBtn').dataset.id=id;
  buildExColorUI();
  renderDraftExercises();
  document.getElementById('rutinaOverlay').classList.add('open');
}

function closeRutinaModal(){document.getElementById('rutinaOverlay').classList.remove('open');}
function bgCloseRutina(e){if(e.target===document.getElementById('rutinaOverlay'))closeRutinaModal();}

function buildExColorUI(){
  const row=document.getElementById('exColorPick');
  row.innerHTML='';
  EX_COLORS.forEach(c=>{
    const b=document.createElement('button');
    b.className='excol'+(c===selExColor?' sel':'');
    b.style.background=c;
    b.title=EX_COLOR_NAMES[EX_COLORS.indexOf(c)];
    b.onclick=()=>{selExColor=c;buildExColorUI();};
    row.appendChild(b);
  });
}

function addExercise(){
  const name=document.getElementById('exNameInp').value.trim();
  const detail=document.getElementById('exDetailInp').value.trim();
  if(!name)return;
  draftExercises.push({id:'e'+Date.now(),name,detail,color:selExColor});
  document.getElementById('exNameInp').value='';
  document.getElementById('exDetailInp').value='';
  document.getElementById('exNameInp').focus();
  renderDraftExercises();
}

function removeExercise(id){
  draftExercises=draftExercises.filter(e=>e.id!==id);
  renderDraftExercises();
}

function renderDraftExercises(){
  const list=document.getElementById('exListPreview');
  list.innerHTML='';
  draftExercises.forEach((ex,i)=>{
    const row=document.createElement('div');
    row.className='ex-preview-row';
    row.innerHTML=`
      <div class="ex-preview-pill" style="background:${ex.color}">
        <span style="font-family:'Bebas Neue',sans-serif;font-size:12px;color:white;letter-spacing:.5px">${String(i+1).padStart(2,'0')}</span>
      </div>
      <span class="ex-preview-name">${ex.name}</span>
      <span class="ex-preview-detail">${ex.detail||''}</span>
      <button class="ex-preview-del" onclick="removeExercise('${ex.id}')">✕</button>`;
    list.appendChild(row);
  });
}

function saveRutina(){
  const name=document.getElementById('rutinaNameInp').value.trim();
  if(!name){
    const i=document.getElementById('rutinaNameInp');
    i.style.borderColor='var(--red)';i.focus();
    setTimeout(()=>i.style.borderColor='',1500);return;
  }
  if(editRutinaId){
    rutinas=rutinas.map(r=>r.id===editRutinaId?{...r,name,exercises:draftExercises}:r);
  } else {
    rutinas.push({id:'r'+Date.now(),name,exercises:draftExercises});
  }
  persistRutinas();closeRutinaModal();renderRutina();
}

function deleteRutina(){
  if(!editRutinaId)return;
  if(!confirm('¿Eliminar esta rutina?'))return;
  rutinas=rutinas.filter(r=>r.id!==editRutinaId);
  persistRutinas();closeRutinaModal();renderRutina();
}

// ── RUTINA DETAIL ─────────────────────────────────────────────────────────
function loadRutinaLogs(){try{return JSON.parse(localStorage.getItem('rlogs_v1')||'{}')}catch(e){return{}}}
function saveRutinaLog(key,val){const d=loadRutinaLogs();d[key]=val;localStorage.setItem('rlogs_v1',JSON.stringify(d));}

function openRutinaDetail(id){
  loadRutinas();
  const r=rutinas.find(x=>x.id===id);if(!r)return;
  const logs=loadRutinaLogs();
  const sheet=document.getElementById('rdetailSheet');

  // header
  document.getElementById('rdetailName').textContent=r.name;
  document.getElementById('rdetailSub').textContent=`${r.exercises.length} ejercicio${r.exercises.length!==1?'s':''}`;

  // body
  const body=document.getElementById('rdetailBody');
  body.innerHTML='';
  const seenColors=new Set();

  r.exercises.forEach((ex,i)=>{
    const isFirstOfColor=!seenColors.has(ex.color);
    if(isFirstOfColor)seenColors.add(ex.color);

    const block=document.createElement('div');
    block.className='rdetail-ex-block';

    // exercise row
    block.innerHTML=`
      <div class="rdetail-ex-row">
        <div class="rdetail-ex-pill" style="background:${ex.color}">
          <span class="rdetail-ex-num">${String(i+1).padStart(2,'0')}</span>
        </div>
        <span class="rdetail-ex-name">${ex.name}</span>
        ${ex.detail?`<span class="rdetail-ex-sets">${ex.detail}</span>`:''}
      </div>`;

    // week slots only for first of each color
    if(isFirstOfColor){
      const weeks=document.createElement('div');
      weeks.className='rdetail-weeks';
      [1,2,3,4].forEach(w=>{
        const wrow=document.createElement('div');
        wrow.className='rdetail-week-row';
        const slots=[0,1,2].map(s=>{
          const key=`${id}_${ex.id}_w${w}_s${s}`;
          const val=logs[key]||'';
          return `<input class="rdetail-slot" placeholder="—" maxlength="12" value="${val}" oninput="saveRutinaLog('${key}',this.value)">`;
        }).join('');
        wrow.innerHTML=`<div class="rdetail-week-label">Semana ${w}</div><div class="rdetail-slots">${slots}</div>`;
        weeks.appendChild(wrow);
      });
      block.appendChild(weeks);
    }

    body.appendChild(block);
  });

  document.getElementById('rdetailOverlay').classList.add('open');
}

function closeRutinaDetail(){document.getElementById('rdetailOverlay').classList.remove('open');}

function deleteRutinaById(){
  const btn=document.getElementById('delRutinaBtn');
  const id=btn.dataset.id;
  if(!id)return;
  if(btn.dataset.confirming==='1'){
    rutinas=rutinas.filter(r=>r.id!==id);
    persistRutinas();closeRutinaModal();renderRutina();
    btn.dataset.confirming='';
    btn.textContent='Eliminar';
  } else {
    btn.dataset.confirming='1';
    btn.textContent='⚠️ Tapeá de nuevo para confirmar';
    setTimeout(()=>{btn.dataset.confirming='';btn.textContent='Eliminar';},3000);
  }
}

</script>

<!-- RUTINA MODAL -->
<div class="overlay" id="rutinaOverlay" onclick="bgCloseRutina(event)">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-inner">
      <div class="modal-title" id="rModalTitle">Nueva rutina</div>

      <div class="fgrp">
        <label class="flbl">Nombre</label>
        <input class="tinput" id="rutinaNameInp" placeholder="ej. Día de pecho" maxlength="40">
      </div>

      <div class="fgrp">
        <label class="flbl">Ejercicios</label>
        <div class="ex-color-pick" id="exColorPick"></div>
        <div class="ex-input-row">
          <input class="tinput" id="exNameInp" placeholder="Nombre del ejercicio" maxlength="40">
          <input class="tinput ex-detail-input" id="exDetailInp" placeholder="4x12" maxlength="20">
        </div>
        <button class="add-ex-btn" onclick="addExercise()">+ Agregar ejercicio</button>
        <div class="ex-list-preview" id="exListPreview"></div>
      </div>

      <button class="sbtn" onclick="saveRutina()">Guardar</button>
      <button class="dbtn" id="delRutinaBtn" style="display:none" onclick="deleteRutinaById()">Eliminar</button>
    </div>
  </div>
</div>

<script>
// Enter key to add exercise — runs after modal HTML exists
document.getElementById('exNameInp').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addExercise();}});
document.getElementById('exDetailInp').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addExercise();}});
</script>

<!-- RUTINA DETAIL OVERLAY -->
<div class="rdetail-overlay" id="rdetailOverlay" onclick="if(event.target===this)closeRutinaDetail()">
  <div class="rdetail-sheet" id="rdetailSheet">
    <div class="rdetail-top" style="position:relative">
      <button class="rdetail-close" onclick="closeRutinaDetail()">✕</button>
      <div class="rdetail-name" id="rdetailName">—</div>
      <div class="rdetail-subtitle" id="rdetailSub">—</div>
    </div>
    <div class="rdetail-body" id="rdetailBody"></div>
  </div>
</div>
</body>
